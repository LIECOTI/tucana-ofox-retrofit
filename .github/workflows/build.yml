name: Build OrangeFox Tucana Retrofit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workspaces
        uses: actions/checkout@v4

      # Шаг 1: Очистка диска раннера
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Шаг 2: Установка Python 3 как дефолтного (Критично для Android 12.1+)
      - name: Setup System Python
        run: |
          sudo apt update
          sudo apt install -y python3 python-is-python3 python2
          python --version

      # Шаг 3: Установка основных зависимостей сборки
      - name: Install Build Dependencies
        run: |
          sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc ccache

      # Шаг 4: Установка утилиты Google Repo
      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      # Шаг 5: Синхронизация исходников OrangeFox (Ветка 12.1)
      - name: Sync OrangeFox Sources
        run: |
          mkdir ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      # Шаг 6: Клонирование дерева устройства tucana
      - name: Clone Device Tree
        run: |
          cd ~/fox_12.1
          git clone https://github.com/SanyaPilot/android_device_xiaomi_tucana.git device/xiaomi/tucana

      # Шаг 7: Клонирование общей ветки sm6150-common (Ветка: lineage-20-unoff)
      - name: Clone SM6150 Common Tree
        run: |
          cd ~/fox_12.1
          git clone -b lineage-20-unoff https://github.com/SanyaPilot/android_device_xiaomi_sm6150-common.git device/xiaomi/sm6150-common

      # Шаг 8: Создание заглушек для vendor-папок, чтобы компилятор не падал
      - name: Create Vendor Mocks
        run: |
          cd ~/fox_12.1
          mkdir -p vendor/xiaomi/sm6150-common
          mkdir -p vendor/xiaomi/tucana
          touch vendor/xiaomi/sm6150-common/BoardConfigVendor.mk
          touch vendor/xiaomi/tucana/BoardConfigVendor.mk

      # Шаг 9: Адаптация ROM-дерева под Recovery и настройка Retrofit + FastbootD
      - name: Configure Device Tree and Patch ROM Dependencies
        run: |
          cd ~/fox_12.1/device/xiaomi/tucana
          
          # 1. Создаем чистый twrp_tucana.mk с наследованием структуры OrangeFox (vendor/fox)
          cat << 'EOF' > twrp_tucana.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)
          $(call inherit-product, vendor/fox/config/common.mk)

          PRODUCT_NAME := twrp_tucana
          PRODUCT_DEVICE := tucana
          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := Mi Note 10
          PRODUCT_MANUFACTURER := Xiaomi

          # Включение FastbootD в раздел рекавери
          PRODUCT_PACKAGES += fastbootd
          EOF

          # 1.5 Перезаписываем AndroidProducts.mk для детекта в lunch
          cat << 'EOF' > AndroidProducts.mk
          PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_tucana.mk
          COMMON_LUNCH_CHOICES := twrp_tucana-eng
          EOF

          # 2. Прописываем параметры Retrofit Partitions в BoardConfig.mk
          echo "" >> BoardConfig.mk
          echo "# Retrofit Dynamic Partitions Configuration" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE := 4831838208" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_VENDOR_DEVICE_SIZE := 2147483648" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE := 1073741824" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_SIZE := 8053063680" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_BLOCK_DEVICES := system vendor cust" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_METADATA_DEVICE := system" >> BoardConfig.mk
          echo "BOARD_QTI_DYNAMIC_PARTITIONS_SIZE := 8048869376" >> BoardConfig.mk

          # 3. Вырезаем из BoardConfigCommon.mk тяжелые зависимости полноценной LineageOS
          cd ~/fox_12.1/device/xiaomi/sm6150-common
          sed -i 's|include device/qcom/sepolicy_vndr-legacy-um/SEPolicy.mk|# include device/qcom/sepolicy_vndr-legacy-um/SEPolicy.mk|g' BoardConfigCommon.mk
          sed -i '/vendor\/lineage/d' BoardConfigCommon.mk

      # Шаг 10: Компиляция рекавери
      - name: Run Compilation
        run: |
          cd ~/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tucana
          export LC_ALL="C"
          
          # Использование предсобранного ядра + патч AVB для Xiaomi A-only
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_PATCH_AVB20=1
          
          # Временно отключаем экстренный выход bash, чтобы зафиксировать вывод ошибок lunch
          set +e
          source build/envsetup.sh
          lunch twrp_tucana-eng
          
          # Возвращаем контроль ошибок для самого процесса сборки
          set -e
          mka adbd recoveryimage

      # Шаг 11: Сохранение готового файла
      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Tucana-Retrofit
          path: ~/fox_12.1/out/target/product/tucana/OrangeFox-unofficial-tucana.img
