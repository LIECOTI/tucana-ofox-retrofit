name: Build OrangeFox Tucana Retrofit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workspaces
        uses: actions/checkout@v4

      # Очистка диска раннера
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Установка Python 2.7 для старых скриптов компиляции
      - name: Setup Python 2.7
        uses: actions/setup-python@v4
        with:
          python-version: '2.7'

      # Установка зависимостей сборки
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc ccache

      # Установка утилиты Google Repo
      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      # Синхронизация исходников OrangeFox (Ветка 12.1)
      - name: Sync OrangeFox Sources
        run: |
          mkdir ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      # Клонирование дерева устройства tucana
      - name: Clone Device Tree
        run: |
          cd ~/fox_12.1
          git clone https://github.com/SanyaPilot/android_device_xiaomi_tucana.git device/xiaomi/tucana

      # Клонирование ТВОЕЙ общей ветки sm6150-common (Ветка: lineage-20-unoff)
      - name: Clone SM6150 Common Tree
        run: |
          cd ~/fox_12.1
          git clone -b lineage-20-unoff https://github.com/SanyaPilot/android_device_xiaomi_sm6150-common.git device/xiaomi/sm6150-common

      # Создание заглушек для vendor-папок, чтобы компилятор не ругался на отсутствие файлов
      - name: Create Vendor Mocks
        run: |
          cd ~/fox_12.1
          mkdir -p vendor/xiaomi/sm6150-common
          mkdir -p vendor/xiaomi/tucana
          touch vendor/xiaomi/sm6150-common/BoardConfigVendor.mk
          touch vendor/xiaomi/tucana/BoardConfigVendor.mk

      # Конфигурация Retrofit и FastbootD
      - name: Configure Retrofit and FastbootD
        run: |
          cd ~/fox_12.1/device/xiaomi/tucana
          
          # Прописываем параметры Retrofit Partitions в BoardConfig.mk
          echo "" >> BoardConfig.mk
          echo "# Retrofit Dynamic Partitions Configuration" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE := 4831838208" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_VENDOR_DEVICE_SIZE := 2147483648" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE := 1073741824" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_SIZE := 8053063680" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_BLOCK_DEVICES := system vendor cust" >> BoardConfig.mk
          echo "BOARD_SUPER_PARTITION_METADATA_DEVICE := system" >> BoardConfig.mk
          echo "BOARD_QTI_DYNAMIC_PARTITIONS_SIZE := 8048869376" >> BoardConfig.mk
          
          # Автоматически добавляем fastbootd в первый попавшийся .mk файл конфигурации устройства
          TARGET_MK=$(find . -name "*.mk" ! -name "BoardConfig.mk" | head -n 1)
          if [ -f "$TARGET_MK" ]; then
            echo "" >> $TARGET_MK
            echo "# Enable FastbootD" >> $TARGET_MK
            echo "PRODUCT_PACKAGES += fastbootd" >> $TARGET_MK
          fi

      # Компиляция рекавери
      - name: Run Compilation
        run: |
          cd ~/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tucana
          export LC_ALL="C"
          
          # Флаги из гайда: обход сборки ядра + патч AVB для Xiaomi A-only
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_PATCH_AVB20=1
          
          # Запуск сборки окружения
          /bin/bash -c "source build/envsetup.sh && lunch twrp_tucana-eng && mka adbd recoveryimage"

      # Сохранение готового файла
      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Tucana-Retrofit
          path: ~/fox_12.1/out/target/product/tucana/OrangeFox-unofficial-tucana.img
