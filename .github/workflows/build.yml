name: Build OrangeFox Tucana Retrofit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      # Шаг 1: Максимальная очистка диска раннера (Освобождаем ~35 ГБ)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Шаг 2: Установка Python и окружения
      - name: Setup System Python
        run: |
          sudo apt update
          sudo apt install -y python3 python-is-python3 python2
          python --version

      # Шаг 3: Установка основных зависимостей сборки
      - name: Install Build Dependencies
        run: |
          sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc ccache

      # Шаг 4: Установка утилиты Google Repo
      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      # Шаг 5: Синхронизация исходников OrangeFox (Ветка 12.1)
      - name: Sync OrangeFox Sources
        run: |
          mkdir ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

      # Шаг 6: Перенос ТВОЕГО чистого дерева устройств в папку сборки
      # Мы берем файлы, которые ты загрузил в свой репозиторий, и копируем их куда нужно
      - name: Setup Clean Device Tree
        run: |
          mkdir -p ~/fox_12.1/device/xiaomi/tucana
          cp -r * ~/fox_12.1/device/xiaomi/tucana/
          
          # Создаем техническую заглушку, чтобы OrangeFox не ругался на пути общего конфига
          mkdir -p ~/fox_12.1/vendor/fox/config
          touch ~/fox_12.1/vendor/fox/config/common.mk

      # Шаг 7: Компиляция рекавери
      - name: Run Compilation
        run: |
          cd ~/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=tucana
          export LC_ALL="C"
          
          # Флаги принудительного использования нашего ядра и патча AVB2.0
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_PATCH_AVB20=1
          
          echo "=== Запуск envsetup ==="
          source build/envsetup.sh
          
          echo "=== Выбор устройства (lunch) ==="
          lunch twrp_tucana-eng
          
          echo "=== Старт сборки ==="
          mka adbd recoveryimage

      # Шаг 8: Сохранение готового файла (.img рекавери появится в релизах воркфлоу)
      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Tucana-Retrofit
          path: ~/fox_12.1/out/target/product/tucana/*.img
